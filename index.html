<script>
(()=>{'use strict';const DEVICE=matchMedia('(max-width:650px)').matches?'phone':'pc';const KEY='poteos.web.v1.'+DEVICE;const defaults={dark:false,clock24:true,dateStyle:'jp',restore:true,startView:'home',confirmPower:true,wallpaper:'',wallpaperFit:'cover',dock:['notes','calculator','calendar','settings'],installed:['notes','calculator','calendar','clock','files','browser','store','settings','about','apps','music'],lastApps:[],z:10,custom:[],windows:{},frequency:{},wallpaperPhone:'',wallpaperPC:'',sleepStyle:'black'};let state;try{state={...defaults,...JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('poteos.web.v1')||'{}')}}catch{state={...defaults}}let maxZ=10, bootTimer, skipBoot=false, wakeBoot=false, sessionUnlocked=false;const apps={notes:['📝','メモ'],calculator:['🧮','電卓'],calendar:['📅','カレンダー'],clock:['🕰️','時計'],files:['📁','ファイル'],browser:['🌐','ブラウザ'],store:['🛍️','ストア'],settings:['⚙️','設定'],about:['🌱','PoteOSについて'],apps:['▦','アプリ一覧'],music:['♫','Pote Music']};const $=s=>document.querySelector(s), controlButton=$('#controlBtn'), powerButton=$('#powerBtn'), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(state))}function toast(s){let t=$('#toast');t.className='toast';t.textContent=s;setTimeout(()=>{t.className=''},2400)}function appInfo(id){let custom=state.custom.find(x=>x.id===id);return custom?[custom.icon||'web',custom.name]:apps[id]||['web',id]}function iconSvg(id){let paths={home:'M3 11l9-7 9 7|M5 10v10h14V10|M10 20v-6h4v6',start:'M3 3h8v8H3z|M13 3h8v8h-8z|M3 13h8v8H3z|M13 13h8v8h-8z',search:'M10.8 4.2a6.6 6.6 0 1 0 0 13.2a6.6 6.6 0 0 0 0-13.2z|M16 16l4.5 4.5',taskview:'M4 5h7v6H4z|M13 5h7v6h-7z|M4 13h7v6H4z|M13 13h7v6h-7z',wifi:'M3 9a14 14 0 0 1 18 0|M6.5 12.5a9 9 0 0 1 11 0|M10 16a4 4 0 0 1 4 0|M12 20h.01',volume:'M4 10v4h4l5 4V6l-5 4z|M17 9a5 5 0 0 1 0 6|M19 6a9 9 0 0 1 0 12',notes:'M6 3.5h9l3 3V20H6z|M15 3.5v4h4|M9 12h6|M9 15.5h6',calculator:'M6 3.5h12v17H6z|M9 7h6|M9 11h.01|M12 11h.01|M15 11h.01|M9 14h.01|M12 14h.01|M15 14h.01|M9 17h.01|M12 17h.01|M15 17h.01',calendar:'M5 5h14v15H5z|M8 3v4|M16 3v4|M5 9h14|M9 12h2|M13 12h2|M9 15h2',clock:'M12 4a8 8 0 1 0 0 16a8 8 0 0 0 0-16z|M12 8v4l3 2',files:'M3.5 7h7l2 2h8v10h-17z|M3.5 7V5h7l2 2',browser:'M4 5h16v14H4z|M4 9h16|M7 7h.01|M9.5 7h.01|M8 15l3-3 2 2 2-2 2 3',store:'M5 9h14l-1 11H6z|M8 9V6a4 4 0 0 1 8 0v3|M9 13v3|M15 13v3',settings:'M12 8a4 4 0 1 0 0 8a4 4 0 0 0 0-8z|M12 3v2|M12 19v2|M3 12h2|M19 12h2|M5.6 5.6L7 7|M17 17l1.4 1.4|M18.4 5.6L17 7|M7 17l-1.4 1.4',about:'M12 20v-8|M12 12C5 12 5 5 5 5s7 0 7 7|M12 15c0-6 7-7 7-7s0 7-7 7',home:'M3 11l9-7 9 7|M5 10v10h14V10|M10 20v-6h4v6',apps:'M4 4h6v6H4z|M14 4h6v6h-6z|M4 14h6v6H4z|M14 14h6v6h-6z',music:'M14 4v11a3 3 0 1 1-2-2.8V7l7-2v8a3 3 0 1 1-2-2.8V4z',web:'M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18z|M3 12h18|M12 3a14 14 0 0 1 0 18|M12 3a14 14 0 0 0 0 18'};let p=(paths[id]||paths.web).split('|').map(d=>`<path d="${d}"/>`).join('');return `<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`}function renderIcons(){let el=$('#icons');el.innerHTML='';state.installed.forEach((id,i)=>{let [ico,name]=appInfo(id);let b=document.createElement('button');b.className='icon';b.draggable=true;b.style.animationDelay=(i*.055)+'s';b.innerHTML=`<span class="glyph">${iconSvg(id)}</span><span>${esc(name)}</span>`;b.onclick=()=>openApp(id);b.ondragstart=e=>{e.dataTransfer.setData('text/plain',id)};b.ondragover=e=>e.preventDefault();b.ondrop=e=>{e.preventDefault();let from=e.dataTransfer.getData('text/plain'),a=state.installed.indexOf(from),z=state.installed.indexOf(id);if(a>=0&&z>=0){state.installed.splice(a,1);state.installed.splice(z,0,from);save();renderIcons()}};el.append(b)})}function setActiveMenu(id){let b=document.querySelector('.system-menu .active-app');if(b)b.textContent=id?appInfo(id)[1]:'デスクトップ'}function updateRunning(){document.querySelectorAll('.dock button[data-app]').forEach(b=>{let w=document.querySelector(`.window[data-app="${CSS.escape(b.dataset.app)}"]`);b.classList.toggle('running',!!w)})}function renderDock(){let d=$('#dock');d.innerHTML='';let launch=document.createElement('button');launch.className='dock-launch';launch.title='アプリケーション';launch.setAttribute('aria-label','アプリケーション');launch.innerHTML=iconSvg('apps');launch.onclick=()=>openApp('apps');d.append(launch);let sep0=document.createElement('span');sep0.className='divider';d.append(sep0);state.dock.forEach(id=>{if(!state.installed.includes(id))return;let [ico,name]=appInfo(id),b=document.createElement('button');b.dataset.app=id;b.title=name;b.innerHTML=iconSvg(id);b.draggable=true;b.ondragstart=e=>e.dataTransfer.setData('text/plain',id);b.ondragover=e=>e.preventDefault();b.ondrop=e=>{e.preventDefault();let from=e.dataTransfer.getData('text/plain'),a=state.dock.indexOf(from),z=state.dock.indexOf(id);if(a>=0&&z>=0){state.dock.splice(a,1);state.dock.splice(z,0,from);save();renderDock()}};b.onclick=()=>openApp(id);d.append(b)});let sep=document.createElement('span');sep.className='divider';d.append(sep);let desktop=document.createElement('button');desktop.className='dock-desktop';desktop.title='デスクトップを表示';desktop.innerHTML=iconSvg('home');desktop.onclick=()=>{document.querySelectorAll('.window').forEach(w=>w.style.display='none');setActiveMenu()};d.append(desktop);updateRunning()}function tick(){let n=new Date();$('#miniClock').textContent=n.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',hour12:!state.clock24});$('#clock').textContent=n.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',hour12:!state.clock24});document.querySelectorAll('.appclock').forEach(x=>x.textContent=$('#clock').textContent);document.querySelectorAll('.appdate').forEach(x=>x.textContent=n.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'long'}));if($('#lockClock'))$('#lockClock').textContent=$('#clock').textContent;if($('#lockDate'))$('#lockDate').textContent=n.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'long'});$('#date').textContent=state.dateStyle==='slash'?`${n.getFullYear()}/${n.getMonth()+1}/${n.getDate()} ${n.toLocaleDateString('ja-JP',{weekday:'long'})}`:n.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'long'})}function windowRect(w){let r=w.getBoundingClientRect();return {x:Math.round(r.left),y:Math.round(r.top),width:Math.round(r.width),height:Math.round(r.height)}}function persistWindow(w){if(innerWidth<650||w.classList.contains('max'))return;let id=w.dataset.app;state.windows[id]=windowRect(w);save()}function focus(w){maxZ++;w.style.zIndex=maxZ}function openApp(id){let existing=document.querySelector(`.window[data-app="${CSS.escape(id)}"]`);if(existing){existing.classList.remove('closing','minimizing');existing.style.display='flex';focus(existing);updateRunning();setActiveMenu(id);return}let [ico,name]=appInfo(id);let w=document.createElement('section');w.className='window';w.dataset.app=id;w.style.zIndex=++maxZ;if(innerWidth>=650&&state.windows[id]){let r=state.windows[id];w.style.transform='none';w.style.left=r.x+'px';w.style.top=r.y+'px';w.style.width=r.width+'px';w.style.height=r.height+'px'}let controls=`<header class="titlebar"><div class="traffic"><button class="close" title="閉じる"></button><button class="min" title="最小化"></button><button class="zoom" title="最大化"></button></div><div class="wtitle">${iconSvg(id)} ${esc(name)}</div>${id==='browser'||state.custom.some(c=>c.id===id)?'<button class="navbtn" data-nav="back" title="戻る">‹</button><button class="navbtn" data-nav="forward" title="進む">›</button>':''}${id==='browser'?'<button class="navbtn" data-nav="reload" title="再読み込み">↻</button>':''}</header><div class="content">${appContent(id)}</div><button class="resize-handle" aria-label="ウィンドウのサイズを変更" title="ドラッグしてサイズ変更"></button>`;w.innerHTML=controls;document.body.append(w);wireWindow(w,id);updateRunning();setActiveMenu(id);if(id==='notes'){let a=w.querySelector('textarea');a.value=localStorage.getItem('poteos.notes.'+DEVICE)||'';a.oninput=()=>localStorage.setItem('poteos.notes.'+DEVICE,a.value)}if(id==='browser')wireBrowser(w);if(id==='settings')wireSettings(w);if(id==='calculator')wireCalc(w);if(id==='store')wireStore(w);if(id==='apps')wireApps(w);if(id==='calendar')renderCalendar(w);if(id==='files')wireFiles(w);if(id==='about')wireAbout(w);state.frequency[id]=(state.frequency[id]||0)+1;state.lastApps=[...new Set([id,...state.lastApps])];state.windows[id]=windowRect(w);save()}function appContent(id){if(state.custom.some(x=>x.id===id)){let c=state.custom.find(x=>x.id===id);return `<div class="small">個人が追加したWebアプリ · PoteOSによる動作確認・保証はありません。 <a href="${esc(c.url)}" target="_blank" rel="noopener">外部ブラウザで開く ↗</a></div><iframe title="${esc(c.name)}" data-frame src="${esc(c.url)}" style="width:100%;height:calc(100% - 25px);border:0;border-radius:10px;margin-top:10px;background:white" sandbox="allow-forms allow-scripts allow-same-origin allow-popups"></iframe><p class="small">表示できないサイトは外部ブラウザで開いてください。</p>`}switch(id){case'apps':return `<h2>アプリ一覧</h2><div class="row"><input class="field" data-app-search placeholder="アプリ名で検索" style="flex:1"><select class="field" data-app-sort><option value="name">名前順</option><option value="used">使用頻度順</option></select></div><div class="appgrid" data-app-list></div>`;case'music':return `<h2>Pote Music</h2><div class="card"><p>YouTube Musicを開いて音楽を楽しめます。</p><a class="btn primary" href="https://music.youtube.com/" target="_blank" rel="noopener">YouTube Musicを開く ↗</a><p class="small">再生・検索・ライブラリ連携はYouTube Musicの公式仕様に従う今後の対応項目です。</p></div>`;case'notes':return `<h2>メモ</h2><p>書いた内容はこのブラウザに保存されます。</p><textarea class="field" placeholder="思いついたことを書いてみよう…"></textarea>`;case'calculator':return `<div class="calc"><input class="field" value="0" readonly aria-label="計算結果">${['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','=','＋','C'].map(x=>`<button data-key="${x}">${x}</button>`).join('')}</div>`;case'calendar':return `<div class="row between"><button class="btn" data-month="-1">‹</button><h2 class="month"></h2><button class="btn" data-month="1">›</button></div><div class="calendar"></div>`;case'clock':return `<div style="text-align:center;padding:32px"><div class="clock appclock"></div><h2 class="appdate"></h2><p>ゆっくり深呼吸。</p></div>`;case'files':return `<h2>ファイル</h2><p>この端末内に保存する簡易ファイル置き場です。</p><div class="row"><input class="field" style="flex:1" placeholder="新しいメモ名"><button class="btn primary" data-create>作成</button></div><div data-files></div>`;case'browser':return `<div class="row"><input class="field" data-url style="flex:1" placeholder="https://example.com"><button class="btn" data-go>開く</button><button class="btn" data-external>↗</button></div><div class="card small">外部サイトは埋め込みを禁止している場合があります。その際は ↗ で開いてください。</div><iframe data-frame title="ブラウザ" style="width:100%;height:calc(100% - 95px);border:0;border-radius:10px;background:white"></iframe>`;case'store':return `<h2>Pote Store</h2><p>初期版のアプリ一覧です。</p><div class="appgrid" data-store></div><div class="card"><h3>Webアプリを追加</h3><div class="row"><input class="field" data-webname placeholder="アプリ名" style="flex:1"><input class="field" data-weburl placeholder="https://…" style="flex:2"><button class="btn primary" data-addweb>追加</button></div><p class="small">埋め込み表示はサイト側の制限を受けます。</p></div>`;case'settings':return `<h2>設定</h2><div class="card"><div class="row between"><div><b>外観</b><div class="small">ナチュラル / ダーク</div></div><button class="btn" data-theme>切り替え</button></div></div><div class="card"><b>壁紙</b><div class="row" style="margin-top:9px"><button class="btn" data-wall="default">水彩の丘</button><label class="btn">画像を選ぶ<input data-upload type="file" accept="image/*" hidden></label><select class="field" data-fit><option value="cover">画面いっぱいに表示</option><option value="contain">全体を表示</option></select></div></div><div class="card"><b>表示</b><div class="row" style="margin-top:9px"><label><input type="checkbox" data-clock> 24時間表示</label><select class="field" data-date><option value="jp">2026年11月23日</option><option value="slash">2026/11/23</option></select></div></div><div class="card"><b>起動と電源</b><p><label><input type="checkbox" data-restore> 前回のアプリを復元</label></p><p><label><input type="checkbox" data-startview> 起動後に前回のアプリを表示</label></p><p><label><input type="checkbox" data-confirm> 終了・再起動前に確認</label></p></div><div class="card password-settings"><b>ログインと画面ロック</b><p class="small">パスワードを設定すると、起動のたびにロック画面を表示します。</p><div class="password-fields"><input class="field" type="password" data-newpass autocomplete="new-password" maxlength="128" placeholder="新しいパスワード"><input class="field" type="password" data-confirmpass autocomplete="new-password" maxlength="128" placeholder="もう一度入力"><button class="btn primary" data-savepass>設定・変更</button><button class="btn" data-removepass>パスワードを解除</button></div><p class="small" data-passstatus></p><p class="small">復旧用の合言葉「復旧」でもロックを解除できます。知っている人は誰でも通過できるため、端末やWebアカウントを保護する認証ではありません。</p></div><div class="card"><b>データ</b><p class="small">設定、アプリ、メモはこのブラウザのローカル保存領域に保存されます。クラウド同期はありません。</p><button class="btn" data-reset>初期状態に戻す</button></div>`;case'about':return `<h2>PoteOS Web</h2><p>ブラウザの中に、自分だけの小さなデジタル環境を。</p><div class="card"><b>初期版でできること</b><p>ホームとDock、ウィンドウ操作、メモ・電卓・カレンダー・時計・ファイル、Webサイト表示、テーマと壁紙の設定。</p></div><div class="card"><b>ブラウザの制約</b><p>OSの実際の終了・再起動・スリープ、クラウド同期、セキュアなアカウント認証、サイト側が禁止するiframe表示は行えません。終了・スリープは画面上の疑似演出です。</p></div><p class="small">PoteOS Web · Single-file prototype</p>`;default:return `<h2>${esc(name)}</h2><p>このアプリは準備中です。</p>`}}
function wireWindow(w,id){let h=w.querySelector('.resize-handle');if(h)h.addEventListener('pointerdown',e=>{if(innerWidth<650||w.classList.contains('max'))return;e.preventDefault();e.stopPropagation();focus(w);let sx=e.clientX,sy=e.clientY,start=windowRect(w);w.style.left=start.x+'px';w.style.top=start.y+'px';w.style.transform='none';w.style.width=start.width+'px';w.style.height=start.height+'px';h.setPointerCapture(e.pointerId);let move=ev=>{w.style.width=Math.min(Math.max(340,innerWidth-start.x-16),Math.max(340,start.width+ev.clientX-sx))+'px';w.style.height=Math.min(Math.max(220,innerHeight-start.y-108),Math.max(220,start.height+ev.clientY-sy))+'px'};let end=()=>{h.removeEventListener('pointermove',move);h.removeEventListener('pointerup',end);persistWindow(w)};h.addEventListener('pointermove',move);h.addEventListener('pointerup',end)});let t=w.querySelector('.titlebar');t.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;if(innerWidth<650||w.classList.contains('max'))return;focus(w);let r=w.getBoundingClientRect(),sx=e.clientX,sy=e.clientY;t.setPointerCapture(e.pointerId);t.onpointermove=ev=>{w.style.left=(r.left+ev.clientX-sx)+'px';w.style.top=(r.top+ev.clientY-sy)+'px';w.style.transform='none'};t.onpointerup=()=>{t.onpointermove=null;persistWindow(w)}});w.addEventListener('pointerdown',()=>focus(w));w.querySelector('.close').onclick=()=>{persistWindow(w);w.classList.add('closing');setTimeout(()=>{if(!w.classList.contains('closing'))return;w.remove();state.lastApps=state.lastApps.filter(x=>x!==id);save();updateRunning();let front=[...document.querySelectorAll('.window')].filter(x=>x.style.display!=='none').sort((a,b)=>(parseInt(b.style.zIndex)||0)-(parseInt(a.style.zIndex)||0))[0];setActiveMenu(front?.dataset.app)},170)};w.querySelector('.min').onclick=()=>{w.classList.add('minimizing');setTimeout(()=>{if(w.classList.contains('minimizing')){w.style.display='none';w.classList.remove('minimizing');let front=[...document.querySelectorAll('.window')].filter(x=>x!==w&&x.style.display!=='none').sort((a,b)=>(parseInt(b.style.zIndex)||0)-(parseInt(a.style.zIndex)||0))[0];setActiveMenu(front?.dataset.app)}},170)};w.querySelector('.zoom').onclick=()=>{w.classList.toggle('max');persistWindow(w)};w.addEventListener('pointerup',()=>persistWindow(w));w.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{let f=w.querySelector('[data-frame]');if(!f)return;if(b.dataset.nav==='back')f.contentWindow.history.back();else if(b.dataset.nav==='forward')f.contentWindow.history.forward();else f.contentWindow.location.reload()})}
function wireBrowser(w){let inp=w.querySelector('[data-url]'),frame=w.querySelector('[data-frame]');function go(){let u=inp.value.trim();if(!u)return;if(!/^https?:\/\//i.test(u))u='https://'+u;try{new URL(u);frame.src=u}catch{toast('URLを確認してください')}}w.querySelector('[data-go]').onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()};w.querySelector('[data-external]').onclick=()=>{let u=inp.value.trim();if(u){if(!/^https?:\/\//i.test(u))u='https://'+u;open(u,'_blank','noopener')}}}
function wireSettings(w){let c=w.querySelector('[data-clock]');c.checked=state.clock24;c.onchange=()=>{state.clock24=c.checked;save();tick()};let d=w.querySelector('[data-date]');d.value=state.dateStyle;d.onchange=()=>{state.dateStyle=d.value;save();tick()};let r=w.querySelector('[data-restore]');r.checked=state.restore;r.onchange=()=>{state.restore=r.checked;save()};let sv=w.querySelector('[data-startview]');sv.checked=state.startView==='last';sv.onchange=()=>{state.startView=sv.checked?'last':'home';save()};let cf=w.querySelector('[data-confirm]');cf.checked=state.confirmPower;cf.onchange=()=>{state.confirmPower=cf.checked;save()};w.querySelector('[data-theme]').onclick=toggleTheme;w.querySelector('[data-wall="default"]').onclick=()=>{state.wallpaper='';state[DEVICE==='phone'?'wallpaperPhone':'wallpaperPC']='';applyWall();save()};let fit=w.querySelector('[data-fit]');fit.value=state.wallpaperFit;fit.onchange=()=>{state.wallpaperFit=fit.value;applyWall();save()};w.querySelector('[data-upload]').onchange=e=>{let f=e.target.files[0];if(!f)return;if(f.size>1800000){toast('画像は1.8MB以下にしてください');return}let rd=new FileReader;rd.onload=()=>{state.wallpaper=rd.result;state[DEVICE==='phone'?'wallpaperPhone':'wallpaperPC']=rd.result;applyWall();save()};rd.readAsDataURL(f)};w.querySelector('[data-reset]').onclick=()=>{if(confirm('このブラウザに保存したPoteOSデータを初期化しますか？')){localStorage.removeItem(KEY);location.reload()}};let status=w.querySelector('[data-passstatus]'),savePass=w.querySelector('[data-savepass]'),removePass=w.querySelector('[data-removepass]');status.textContent=state.passwordHash?'パスワード保護は有効です。次回起動時に入力します。':'パスワード保護は無効です。';savePass.onclick=async()=>{let a=w.querySelector('[data-newpass]'),b=w.querySelector('[data-confirmpass]');if(a.value.length<4){status.textContent='4文字以上で入力してください。';a.focus();return}if(a.value!==b.value){status.textContent='2つの入力が一致しません。';b.focus();return}if(!crypto.subtle){status.textContent='安全なパスワード保存にはHTTPS接続が必要です。';return}let bytes=crypto.getRandomV function applyWall(){let e=$('#wall'),chosen=DEVICE==='phone'?(state.wallpaperPhone||state.wallpaper):(state.wallpaperPC||state.wallpaper);if(chosen){e.classList.add('photo');e.style.backgroundImage=`url("${chosen}")`;e.style.backgroundSize=state.wallpaperFit}else{e.classList.remove('photo');e.style.backgroundImage='';e.style.backgroundSize=''}}function toggleTheme(){state.dark=!state.dark;document.body.classList.toggle('dark',state.dark);save()}function wireCalc(w){let input=w.querySelector('input'),expr='';w.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{let k=b.dataset.key;if(k==='C'){expr='';input.value='0';return}if(k==='='){try{let safe=expr.replaceAll('＋','+').replaceAll('−','-').replaceAll('×','*').replaceAll('÷','/');if(!/^[0-9+*/.()\- ]+$/.test(safe))throw 0;let result=Function('"use strict";return ('+safe+')')();expr=String(Number(result.toFixed(8)));input.value=expr}catch{input.value='Error';expr=''}return}expr+=k;input.value=expr})}function renderCalendar(w,offset=0){let d=new Date;d.setDate(1);d.setMonth(d.getMonth()+offset);w.querySelector('.month').textContent=d.toLocaleDateString('ja-JP',{year:'numeric',month:'long'});let g=w.querySelector('.calendar');g.innerHTML='';['日','月','火','水','木','金','土'].forEach(x=>g.innerHTML+=`<div class="small">${x}</div>`);let first=d.getDay(),days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();for(let i=0;i<first;i++)g.innerHTML+='<div></div>';for(let i=1;i<=days;i++){let now=new Date,isToday=i===now.getDate()&&d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();g.innerHTML+=`<div class="${isToday?'today':''}">${i}</div>`}w.querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>renderCalendar(w,offset+Number(b.dataset.month)))}
function wireFiles(w){let list=w.querySelector('[data-files]'),files=JSON.parse(localStorage.getItem('poteos.files.'+DEVICE)||'[]');function draw(){list.innerHTML=files.map((x,i)=>`<div class="card row between"><span>📄 ${esc(x)}</span><button class="btn" data-del="${i}">削除</button></div>`).join('');list.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{files.splice(+b.dataset.del,1);localStorage.setItem('poteos.files.'+DEVICE,JSON.stringify(files));draw()})}draw();w.querySelector('[data-create]').onclick=()=>{let x=w.querySelector('input').value.trim();if(x){files.push(x);localStorage.setItem('poteos.files.'+DEVICE,JSON.stringify(files));w.querySelector('input').value='';draw()}}}function wireApps(w){let list=w.querySelector('[data-app-list]'),search=w.querySelector('[data-app-search]'),sort=w.querySelector('[data-app-sort]');function draw(){let q=search.value.trim().toLocaleLowerCase('ja');let ids=[...state.installed].filter(id=>{let [,n]=appInfo(id);return n.toLocaleLowerCase('ja').includes(q)});ids.sort((a,b)=>sort.value==='used'?((state.frequency[b]||0)-(state.frequency[a]||0)||appInfo(a)[1].localeCompare(appInfo(b)[1],'ja')):appInfo(a)[1].localeCompare(appInfo(b)[1],'ja'));list.innerHTML=ids.map(id=>`<button class="storeitem app-launch" data-launch="${esc(id)}"><span class="glyph">${iconSvg(id)}</span><b>${esc(appInfo(id)[1])}</b></button>`).join('');list.querySelectorAll('[data-launch]').forEach(b=>b.onclick=()=>openApp(b.dataset.launch))}search.oninput=draw;sort.onchange=draw;draw()}function wireStore(w){let list=w.querySelector('[data-store]');list.innerHTML=Object.entries(apps).filter(([id])=>id!=='store'&&id!=='about').map(([id,[ico,name]])=>`<div class="storeitem"><span class="glyph">${iconSvg(id)}</span><b>${name}</b><div style="margin-top:8px"><button class="btn" data-install="${id}">${state.installed.includes(id)?'追加済み':'ホームに追加'}</button></div></div>`).join('');list.querySelectorAll('[data-install]').forEach(b=>b.onclick=()=>{let id=b.dataset.install;if(!state.installed.includes(id)){state.installed.push(id);save();renderIcons();renderDock();b.textContent='追加済み'}else openApp(id)});w.querySelector('[data-addweb]').onclick=()=>{let n=w.querySelector('[data-webname]').value.trim(),u=w.querySelector('[data-weburl]').value.trim();if(!n||!u){toast('アプリ名とURLを入力してください');return}if(!/^https?:\/\//i.test(u))u='https://'+u;try{new URL(u)}catch{toast('URLを確認してください');return}let id='web-'+Date.now();state.custom.push({id,name:n,url:u,icon:'web'});state.installed.push(id);save();renderIcons();renderDock();toast('Webアプリを追加しました')}}function wireAbout(w){}function power(action){if(state.confirmPower&&action!=='sleep'&&!confirm(action==='restart'?'PoteOSを再起動しますか？':'PoteOSを終了しますか？'))return;let o=$('#overlay');o.hidden=false;o.className='overlay sleep';if(action==='sleep'){wakeBoot=false;o.setAttribute('aria-label','スリープ中。クリックまたはキー入力で復帰');o.innerHTML='';o.onclick=()=>wake();return}if(action==='off'){wakeBoot=true;o.innerHTML='<div><h2>PoteOS は終了しました</h2><button class="btn primary" onclick="event.stopPropagation();window.__poteWake()">電源を入れる</button><div class="powerhint">この画面上だけの疑似終了です</div></div>';return}document.querySelectorAll('.window').forEach(x=>x.remove());wakeBoot=true;o.innerHTML='<div><div style="font-size:42px">◌</div><h2>再起動しました</h2><div class="powerhint">クリックまたはスペースキーで起動</div></div>';o.onclick=()=>wake()}function wake(){let o=$('#overlay');o.hidden=true;o.onclick=null;if(wakeBoot){wakeBoot=false;startBoot()}}window.__poteWake=wake;document.querySelector('.home').addEventListener('contextmenu',e=>{if(innerWidth<650)return;e.preventDefault();let m=document.getElementById('deskMenu');if(!m){m=document.createElement('div');m.id='deskMenu';m.className='shade desk-menu';document.body.append(m)}m.style.left=Math.min(e.clientX,innerWidth-220)+'px';m.style.top=Math.min(e.clientY,innerHeight-180)+'px';m.innerHTML='<button class="btn" data-cmd="wall">壁紙を変更</button><button class="btn" data-cmd="display">ディスプレイ設定</button><button class="btn" data-cmd="refresh">デスクトップを更新</button>';m.hidden=false;m.querySelector('[data-cmd=wall]').onclick=()=>{m.hidden=true;openApp('settings')};m.querySelector('[data-cmd=display]').onclick=()=>{m.hidden=true;openApp('settings')};m.querySelector('[data-cmd=refresh]').onclick=()=>{m.hidden=true;renderIcons();renderDock()}});document.addEventListener('click',e=>{let m=document.getElementById('deskMenu');if(m&&!m.contains(e.target))m.hidden=true});$('#powerBtn').onclick=()=>{let s=$('#shade');s.hidden=false;s.innerHTML='<h3>電源</h3><div class="row"><button class="btn" data-p="sleep">スリープ</button><button class="btn" data-p="restart">再起動</button><button class="btn" data-p="off">終了</button></div>';s.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{s.hidden=true;power(b.dataset.p)})};$('#controlBtn').onclick=()=>{let s=$('#shade');s.hidden=!s.hidden;if(!s.hidden){s.innerHTML=`<div class="row between"><b>コントロールセンター</b><button class="btn" data-close>閉じる</button></div><div class="card row"><button class="btn" data-toggle="theme">${state.dark?'☀️ ライト':'🌙 ダーク'}</button><button class="btn" data-toggle="settings">⚙️ 設定</button></div><div class="small">${navigator.onLine?'オンライン':'オフライン'} · ローカル保存</div>`;s.querySelector('[data-close]').onclick=()=>s.hidden=true;s.querySelector('[data-toggle="theme"]').onclick=toggleTheme;s.querySelector('[data-toggle="settings"]').onclick=()=>{s.hidden=true;openApp('settings')}}};document.addEventListener('keydown',e=>{let o=$('#overlay');if(o.hidden)return;if(o.classList.contains('boot')){skipBoot=true;clearTimeout(bootTimer);finishBoot()}else if(o.classList.contains('lock')){return}else{if(e.code==='Space')e.preventDefault();wake()}});function startBoot(){sessionUnlocked=false;let o=$('#overlay');o.hidden=false;o.className='overlay boot';o.removeAttribute('aria-label');o.innerHTML='<div class="bootbox"><div class="boot-orbit"><svg class="bootmark" viewBox="0 0 32 32" aria-hidden="true"><path d="M9 8c-3 2-5 6-4 11 1 6 6 9 12 8 6-1 10-5 10-11 0-5-3-9-8-10-4-1-7 0-10 2zM16 7c1-4 5-6 9-5-1 4-4 6-8 6"/></svg></div><div class="bootlogo">PoteOS</div><div class="boot-tagline">自然と、ひとつになる場所</div><div class="boot-note">PoteOS を準備しています</div><div class="boot-skip">クリックまたはキー入力でスキップ</div></div>';skipBoot=false;o.onclick=finishBoot;bootTimer=setTimeout(finishBoot,3000)}function digestPassword(value,salt){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+value)).then(buf=>Array.from(new Uint8Array(buf),x=>x.toString(16).padStart(2,'0')).join(''))}function showLock(){let o=$('#overlay'),chosen=DEVICE==='phone'?(state.wallpaperPhone||state.wallpaper):(state.wallpaperPC||state.wallpaper);o.hidden=false;o.className='overlay lock';o.onclick=null;o.innerHTML='<div class="lockscene"></div><div class="lock-menubar"><span>◦ PoteOS</span><span>安全なロック画面 · '+(DEVICE==='phone'?'モバイル':'デスクトップ')+'</span></div><div class="lock-clock"><div id="lockClock"></div><div id="lockDate"></div></div><form class="login-card"><div class="login-mark">'+iconSvg('about')+'</div><h1>PoteOSへようこそ</h1><p>続けるにはパスワードを入力してください</p><input class="field" type="password" autocomplete="current-password" maxlength="128" placeholder="パスワード" required><button class="btn primary" type="submit">ロックを解除</button><div class="login-error" role="alert"></div><div class="recovery-note">忘れたときは <b>復旧</b> と入力</div></form><div class="lock-bottom">クリックまたはキー入力でログイン</div>';if(chosen){o.querySelector('.lockscene').style.backgroundImage='linear-gradient(180deg,rgba(34,49,39,.16),rgba(30,43,35,.36)),url("'+chosen+'")'}tick();let form=o.querySelector('form'),input=form.querySelector('input'),error=form.querySelector('.login-error');form.onsubmit=async e=>{e.preventDefault();if(form.dataset.unlocking)return;let recovery=input.value.trim()==='復旧',hash=recovery?'':await digestPassword(input.value,state.passwordSalt||'');if(recovery||hash===state.passwordHash){form.dataset.unlocking='true';form.querySelector('button').disabled=true;sessionUnlocked=true;o.classList.add('unlocking');setTimeout(()=>{o.hidden=true;o.onclick=null;continueDesktop()},420)}else{error.textContent='パスワードが違います。もう一度お試しください。';input.value='';input.focus();form.classList.remove('shake');void form.offsetWidth;form.classList.add('shake')}};setTimeout(()=>input.focus(),80)}function continueDesktop(){document.querySelectorAll('.icon').forEach((x,i)=>x.style.animationDelay=`${i*.08}s`);if(state.restore&&state.lastApps.length){state.lastApps.slice().reverse().forEach(id=>{if(state.installed.includes(id)||state.custom.some(c=>c.id===id))openApp(id)});if(state.startView==='home')document.querySelectorAll('.window').forEach(w=>w.style.display='none');else{let w=document.querySelector(`.window[data-app="${CSS.escape(state.lastApps[0])}"]`);if(w)focus(w)}}}function finishBoot(){clearTimeout(bootTimer);let o=$('#overlay');if(o.hidden||o.classList.contains('boot-exit'))return;o.onclick=null;o.classList.add('boot-exit');setTimeout(()=>{if(state.passwordHash&&!sessionUnlocked){showLock();return}o.hidden=true;continueDesktop()},230)}$('#overlay').onclick=finishBoot;function init(){document.body.classList.toggle('dark',state.dark);applyWall();renderIcons();renderDock();tick();setInterval(tick,1000);startBoot()}init();
